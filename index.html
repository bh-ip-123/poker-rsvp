<title>Deal Me In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3EAD3;
    --bg-2:#FBF6E9;
    --surface:#FFFFFF;
    --surface-2:#F3EAD6;
    --ink:#241F17;
    --ink-soft:#5B5240;
    --ink-faint:#93876E;
    --felt:#0B4A34;
    --felt-2:#2FAE7A;
    --felt-deep:#062E20;
    --felt-ink:#F5F1E4;
    --brass:#E3A72E;
    --brass-strong:#B9790E;
    --brass-bright:#F4C660;
    --chip-red:#C43A2C;
    --line:#E4D8B8;
    --line-soft:#EFE6CC;
    --shadow:0 2px 4px rgba(36,31,23,0.08), 0 14px 32px -14px rgba(36,31,23,0.28);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15110C;
      --bg-2:#1E1811;
      --surface:#231C14;
      --surface-2:#2B2217;
      --ink:#F5EFDF;
      --ink-soft:#CDBFA0;
      --ink-faint:#8C7F65;
      --felt:#07271B;
      --felt-2:#33B584;
      --felt-deep:#03140D;
      --felt-ink:#F5F1E4;
      --brass:#E9BB4E;
      --brass-strong:#F6D374;
      --brass-bright:#FFE39A;
      --chip-red:#E8806E;
      --line:#3D3220;
      --line-soft:#2E2718;
      --shadow:0 2px 4px rgba(0,0,0,0.35), 0 14px 32px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15110C;
    --bg-2:#1E1811;
    --surface:#231C14;
    --surface-2:#2B2217;
    --ink:#F5EFDF;
    --ink-soft:#CDBFA0;
    --ink-faint:#8C7F65;
    --felt:#07271B;
    --felt-2:#33B584;
    --felt-deep:#03140D;
    --felt-ink:#F5F1E4;
    --brass:#E9BB4E;
    --brass-strong:#F6D374;
    --brass-bright:#FFE39A;
    --chip-red:#E8806E;
    --line:#3D3220;
    --line-soft:#2E2718;
    --shadow:0 2px 4px rgba(0,0,0,0.35), 0 14px 32px -14px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1500px 950px at 50% 6%, var(--felt-2) 0%, var(--felt) 46%, var(--felt-deep) 80%, #030F0A 100%);
    color:var(--ink);
    font-family:"Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{position:relative; z-index:1;}
  h1,h2,h3{font-family:"Fraunces", Georgia, serif; text-wrap:balance; margin:0;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}

  .wrap{max-width:640px; margin:0 auto; padding:28px 18px 90px;}

  .banner{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink-soft);
    border-radius:10px;
    padding:10px 14px;
    font-size:13.5px;
    margin-bottom:16px;
  }

  /* ---------- Invite card ---------- */
  .invite-card{
    position:relative;
    background:
      radial-gradient(circle at 15% 15%, rgba(255,255,255,0.10) 0, transparent 42%),
      radial-gradient(circle at 88% 85%, rgba(0,0,0,0.20) 0, transparent 46%),
      linear-gradient(155deg, var(--felt-2) 0%, var(--felt) 46%, var(--felt-deep) 100%);
    color:var(--felt-ink);
    border-radius:18px;
    padding:26px 24px 24px;
    box-shadow:var(--shadow);
    overflow:hidden;
    animation:riseIn 0.5s ease-out both;
  }
  /* Four aces — one of each suit — as a watermark instead of a single
     spade, standing in for "a strong hand." Visible but see-through. */
  .invite-card::after{
    content:"♠ ♥ ♦ ♣";
    position:absolute;
    right:-10px;
    top:-14px;
    font-family:"Fraunces", serif;
    font-size:52px;
    letter-spacing:-2px;
    color:rgba(255,255,255,0.18);
    line-height:1;
    pointer-events:none;
  }
  @media (prefers-reduced-motion: reduce){ .invite-card{animation:none;} }
  @keyframes riseIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .invite-top{display:flex; align-items:center; justify-content:flex-end; gap:12px; position:relative; z-index:1;}
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:0.12em;
    font-size:11.5px;
    font-weight:600;
    color:var(--brass-strong);
  }
  .edit-btn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    color:var(--felt-ink);
    border-radius:999px;
    padding:5px 12px;
    font-size:12.5px;
    font-family:inherit;
    cursor:pointer;
  }
  .edit-btn:hover{background:rgba(255,255,255,0.15);}

  .invite-title{
    font-size:clamp(26px, 6vw, 34px);
    font-style:italic;
    font-weight:500;
    margin-top:10px;
    position:relative;
    z-index:1;
  }

  .meta-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 20px;
    margin:20px 0 0;
    position:relative;
    z-index:1;
  }
  .meta-grid .meta-item:nth-child(5){grid-column:1 / -1;}
  .meta-item dt{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:rgba(237,231,214,0.6);
    margin-bottom:3px;
  }
  .meta-item dd{margin:0; font-size:15px; font-weight:500;}
  .meta-item dd.mono{font-size:15px;}
  .meta-item dd.venue-needed{color:var(--brass-bright); font-weight:700;}

  .venue-banner{margin:10px 0 0; padding:10px 14px; border-radius:9px; font-size:13.5px; font-weight:600;}
  .venue-banner-needed{background:rgba(227,167,46,0.14); border:1px solid var(--brass); color:var(--brass-strong);}
  .venue-banner-set{background:rgba(47,174,122,0.12); border:1px solid var(--felt-2); color:var(--ink); font-weight:500;}

  .seat-stat{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid rgba(255,255,255,0.12);
    position:relative;
    z-index:1;
  }
  .seat-numbers{display:flex; align-items:baseline; gap:6px;}
  .seat-numbers .n{font-size:30px; font-weight:600;}
  .seat-numbers .slash{font-size:20px; color:rgba(237,231,214,0.5);}
  .seat-numbers .max{font-size:20px; color:rgba(237,231,214,0.75);}
  .seat-numbers .label{
    font-family:"Public Sans", sans-serif;
    font-size:12.5px;
    color:rgba(237,231,214,0.6);
    margin-left:2px;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .pip-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .pip{width:11px; height:11px; border-radius:50%; border:1.5px solid rgba(212,171,74,0.55); background:transparent; flex:none;}
  .pip.filled{background:var(--brass-strong); border-color:var(--brass-strong);}
  .pip.wait{background:var(--chip-red); border-color:var(--chip-red);}
  .seat-note{font-size:13px; color:rgba(237,231,214,0.7); margin:10px 0 0;}
  .invite-note{
    margin:16px 0 0;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,0.1);
    font-size:13.5px;
    color:rgba(237,231,214,0.75);
    font-style:italic;
    position:relative;
    z-index:1;
  }
  .invite-note:empty{display:none;}

  /* ---------- Cards ---------- */
  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px 22px 22px;
    margin-top:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:4px;
    background:linear-gradient(90deg, var(--felt-2), var(--brass));
  }
  .card h2{font-size:19px; font-weight:600; font-style:italic; color:var(--felt-2);}
  .hint{color:var(--ink-soft); font-size:13.5px; margin:6px 0 0;}

  .card-fan{display:flex; gap:4px; margin-top:2px;}
  .mini-card{
    width:30px; height:42px; border-radius:5px;
    background:#FBF8EE;
    border:1px solid var(--brass);
    display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono", monospace; font-weight:700; font-size:12px;
    color:#201A10;
    box-shadow:0 2px 5px rgba(0,0,0,0.18);
    flex:none;
  }
  .mini-card:nth-child(1){transform:rotate(-10deg) translateY(3px);}
  .mini-card:nth-child(2){transform:rotate(-5deg) translateY(1px);}
  .mini-card:nth-child(3){transform:rotate(0deg);}
  .mini-card:nth-child(4){transform:rotate(5deg) translateY(1px);}
  .mini-card:nth-child(5){transform:rotate(10deg) translateY(3px);}

  form{display:flex; flex-direction:column; gap:14px; margin-top:16px;}
  label{display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color:var(--ink-soft);}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  input{
    font-family:"Public Sans", sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 12px;
    font-weight:400;
  }
  input:focus{outline:2px solid var(--felt-2); outline-offset:1px; border-color:var(--felt-2);}
  input[type=number], input[type=date], input[type=time]{font-family:"IBM Plex Mono", monospace;}
  textarea{
    font-family:"Public Sans", sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 12px;
    font-weight:400;
    resize:vertical;
  }
  textarea:focus{outline:2px solid var(--felt-2); outline-offset:1px; border-color:var(--felt-2);}

  .status-toggle{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .status-btn{
    font-family:"Public Sans", sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:10px 6px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .status-btn:hover{border-color:var(--felt-2);}
  .status-btn.active[data-status="in"]{background:var(--felt); border-color:var(--felt); color:var(--felt-ink);}
  .status-btn.active[data-status="maybe"]{background:var(--brass); border-color:var(--brass); color:#231A08;}
  .status-btn.active[data-status="out"]{background:var(--chip-red); border-color:var(--chip-red); color:#FFF3F1;}

  .guest-row{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface-2); border-radius:9px; padding:10px 14px;}
  .guest-row span:first-child{font-size:13.5px; color:var(--ink-soft); font-weight:600;}
  .stepper{display:flex; align-items:center; gap:12px;}
  .stepper button{
    width:28px; height:28px; border-radius:50%;
    border:1.5px solid var(--felt-2); background:var(--surface); color:var(--felt-2);
    font-size:16px; line-height:1; cursor:pointer; font-family:inherit;
  }
  .stepper button:hover{background:var(--felt-2); color:var(--felt-ink);}
  .stepper span{font-family:"IBM Plex Mono", monospace; font-size:15px; min-width:14px; text-align:center;}

  .btn-primary{
    background:linear-gradient(135deg, var(--brass-bright) 0%, var(--brass) 55%, var(--brass-strong) 100%);
    color:#241505;
    border:none;
    border-radius:9px;
    padding:12px 16px;
    font-family:"Public Sans", sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 16px -8px rgba(185,121,14,0.55);
    transition:transform 0.1s ease, filter 0.15s ease;
  }
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-primary:active{transform:scale(0.98);}
  .btn-ghost{
    background:none;
    border:none;
    color:var(--chip-red);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    padding:4px 0;
    text-align:left;
    font-family:"Public Sans", sans-serif;
  }
  .btn-ghost:hover{text-decoration:underline;}

  .edit-panel{
    margin-top:16px;
    padding-top:16px;
    border-top:1px dashed var(--line);
    display:none;
  }
  .edit-panel.open{display:block;}
  .edit-panel .hint{color:rgba(237,231,214,0.7);}
  .edit-panel label{color:rgba(237,231,214,0.75);}

  /* ---------- Roster ---------- */
  .roster-sub{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-faint);
    font-weight:700;
    margin:20px 0 10px;
    font-family:"Public Sans", sans-serif;
  }
  .roster-list{display:flex; flex-direction:column; gap:1px; border-radius:10px; overflow:hidden; border:1px solid var(--line-soft);}
  .seat-row{
    display:flex;
    align-items:baseline;
    gap:12px;
    padding:11px 14px;
    background:var(--surface);
    border-bottom:1px solid var(--line-soft);
  }
  .seat-row:last-child{border-bottom:none;}
  .seat-row .idx{font-family:"IBM Plex Mono", monospace; font-size:12.5px; color:var(--ink-faint); width:18px; flex:none;}
  .seat-row .who{font-weight:600; font-size:14.5px;}
  .seat-row .badge{
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px;
    color:var(--felt-2);
    background:rgba(47,174,122,0.14);
    padding:1px 7px;
    border-radius:999px;
    flex:none;
  }
  .seat-row.status-waitlist .badge{color:var(--chip-red); background:rgba(196,58,44,0.14);}
  .seat-row.status-maybe .badge{color:var(--brass-strong); background:rgba(227,167,46,0.16);}
  .seat-row.status-out .badge{color:var(--ink-faint); background:rgba(147,135,110,0.16);}
  .seat-row.status-maybe .who, .seat-row.status-out .who{color:var(--ink-soft);}
  .seat-row{flex-wrap:wrap;}
  .seat-row .note{color:var(--ink-soft); font-size:13px; font-style:italic; margin-left:auto; text-align:right; max-width:55%;}

  .chip-list{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 12px 5px 8px;
    font-size:13.5px;
    font-weight:600;
  }
  .chip .dot{width:7px; height:7px; border-radius:50%; background:var(--brass); flex:none;}

  .muted-list{color:var(--ink-faint); font-size:13.5px; margin:0; line-height:1.6;}

  /* ---------- Clickable RSVP table ---------- */
  /* One line per row. The seat badge and guest stepper get fixed widths
     (not content-sized) so the status buttons and note field always
     start at the same x position across rows, whether or not that row
     happens to have a seat badge or an active guest stepper. On screens
     too narrow to fit everything, the row scrolls horizontally rather
     than wrapping, so the line never breaks. */
  .rsvp-table{display:flex; flex-direction:column; border-radius:10px; overflow:hidden; border:1px solid var(--line-soft); margin-top:14px;}
  .rr-row{
    display:flex; flex-wrap:nowrap; align-items:center; gap:8px;
    padding:10px 12px; background:var(--surface); border-bottom:1px solid var(--line-soft);
    overflow-x:auto;
  }
  .rr-row:last-child{border-bottom:none;}
  .rr-name{
    flex:0 0 auto; white-space:nowrap;
    font-weight:600; font-size:14px;
  }
  .rr-seat{
    flex:0 0 64px; text-align:center; white-space:nowrap;
    font-family:"IBM Plex Mono", monospace; font-size:10.5px; color:var(--felt-2);
    background:rgba(47,174,122,0.14); padding:2px 4px; border-radius:999px;
  }
  .rr-seat.waiting{color:var(--chip-red); background:rgba(196,58,44,0.14);}
  .rr-seat:empty{background:none;}
  .rr-status{flex:0 0 auto; display:flex; gap:4px;}
  .rr-btn{
    font-family:"Public Sans", sans-serif; font-size:11px; font-weight:600; white-space:nowrap;
    padding:5px 8px; border-radius:6px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink-soft); cursor:pointer;
  }
  .rr-btn:hover{border-color:var(--felt-2);}
  .rr-btn.active[data-status="in"]{background:var(--felt-2); border-color:var(--felt-2); color:var(--felt-ink);}
  .rr-btn.active[data-status="maybe"]{background:#F0C929; border-color:#F0C929; color:#241505;}
  .rr-btn.active[data-status="out"]{background:var(--chip-red); border-color:var(--chip-red); color:#FFF3F1;}
  .rr-guests{flex:0 0 48px; display:flex; align-items:center; gap:3px;}
  .rr-guests button{
    width:18px; height:18px; border-radius:50%; border:1.5px solid var(--felt-2); flex:none;
    background:var(--surface); color:var(--felt-2); font-size:11px; line-height:1; cursor:pointer; font-family:inherit;
  }
  .rr-guests button:hover{background:var(--felt-2); color:var(--felt-ink);}
  .rr-guests span{font-family:"IBM Plex Mono", monospace; font-size:11.5px; min-width:9px; text-align:center;}
  .rr-note{
    flex:1 1 70px; min-width:56px; font-family:"Public Sans", sans-serif; font-size:12.5px;
    color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:5px 8px;
  }
  .rr-note:focus{outline:2px solid var(--felt-2); outline-offset:1px; border-color:var(--felt-2);}
  .rr-note:disabled{background:var(--surface-2); color:var(--ink-faint);}

  .hist-list{display:flex; flex-direction:column; gap:1px; border-radius:10px; overflow:hidden; border:1px solid var(--line-soft); margin-top:12px;}
  .hist-row{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px; padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--line-soft);}
  .hist-row:last-child{border-bottom:none;}
  .hist-name{font-weight:600; font-size:14px; flex:1 1 auto;}
  .hist-stat{font-size:12.5px; color:var(--ink-soft);}
  .hist-stat.mono{font-family:"IBM Plex Mono", monospace; color:var(--ink-faint); font-size:11.5px;}

  ::selection{background:var(--brass); color:#241B09;}
</style>

<div class="wrap">
  <div id="banner" class="banner" hidden></div>
  <div id="app"></div>
</div>

<script>

  var SUPABASE_URL = "https://yyzkqvejcyxpigfdjuee.supabase.co";

  var state = {

  };

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  // The game always falls on the fourth Thursday of the month at 8:00 PM
  // Eastern Time (DST-aware) — never entered manually, always computed.
  function getNYParts(date){
    var fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"
    });
    var obj = {};
    fmt.formatToParts(date).forEach(function(p){ if (p.type !== "literal") obj[p.type] = p.value; });
    return { year: Number(obj.year), month: Number(obj.month) - 1, day: Number(obj.day) };
  }
  function fourthThursdayDay(year, month){
    var d = new Date(Date.UTC(year, month, 1));
    var dow = d.getUTCDay(); // 0=Sun..6=Sat
    var firstThursday = 1 + ((4 - dow + 7) % 7);
    return firstThursday + 21;
  }
  function currentGameDateParts(now){
    var t = getNYParts(now);
    var day = fourthThursdayDay(t.year, t.month);
    if (t.day > day){
      var m = t.month + 1, y = t.year;
      if (m > 11){ m = 0; y += 1; }
      return { year: y, month: m, day: fourthThursdayDay(y, m) };
    }
    return { year: t.year, month: t.month, day: day };
  }
  function gameDateKey(p){
    return p.year + "-" + String(p.month + 1).padStart(2, "0") + "-" + String(p.day).padStart(2, "0");
  }
  function formatGameDateDisplay(p){
    var dt = new Date(Date.UTC(p.year, p.month, p.day));
    var dateFmt = dt.toLocaleDateString(undefined, {timeZone: "UTC", weekday: "short", month: "short", day: "numeric"});
    return dateFmt + " · 8:00 PM ET";
  }
  // Formats an explicit "YYYY-MM-DD" + "HH:MM" pair (a host override) the
  // same way as the auto-computed default, so the two look identical.
  function formatEffectiveWhen(dateStr, timeStr){
    if (!dateStr) return "—";
    var bits = dateStr.split("-").map(Number);
    var dt = new Date(Date.UTC(bits[0], bits[1] - 1, bits[2]));
    var dateFmt = dt.toLocaleDateString(undefined, {timeZone: "UTC", weekday: "short", month: "short", day: "numeric"});
    if (!timeStr) return dateFmt;
    var tp = timeStr.split(":");
    var hh = Number(tp[0]), mm = tp[1] || "00";
    var ampm = hh >= 12 ? "PM" : "AM";
    var hh12 = hh % 12; if (hh12 === 0) hh12 = 12;
    return dateFmt + " · " + hh12 + ":" + String(mm).padStart(2, "0") + " " + ampm + " ET";
  }
  // The effective game date is the auto default UNLESS the host saved an
  // explicit override for this exact cycle (overrideKey matches today's
  // auto-computed key) — a stale override from a past month is ignored.
  function effectiveGameInfo(event, now){
    var autoParts = currentGameDateParts(now);
    var autoKey = gameDateKey(autoParts);
    if (event && event.overrideKey === autoKey && event.date){
      return { key: event.date, display: formatEffectiveWhen(event.date, event.time) };
    }
    return { key: autoKey, display: formatGameDateDisplay(autoParts) };
  }

  function computeSeating(rsvps, maxSeats){
    var inList = rsvps.filter(function(r){ return r.status === "in"; });
    var used = 0, confirmed = [], waitlist = [];
    for (var i=0;i<inList.length;i++){
      var r = inList[i];
      var party = 1 + (Number(r.guests) || 0);
      if (used + party <= maxSeats){ confirmed.push(r); used += party; }
      else { waitlist.push(r); }
    }
    return { confirmed: confirmed, waitlist: waitlist, used: used };
  }

  function mountMain(){

    view.mainMounted = true;

    document.getElementById("editBtn").addEventListener("click", function(){
      var panel = document.getElementById("editPanel");

      if (view.editOpen) fillEditForm();
    });
    document.getElementById("editForm").addEventListener("submit", function(ev){
      ev.preventDefault();
      var details = {
        // Venue fields aren't part of this form — carry over whatever
        // is already claimed so saving other edits doesn't erase it.
        location: (state.event || {}).location,
        venueHost: (state.event || {}).venueHost,
        venueKey: (state.event || {}).venueKey,
        gameType: document.getElementById("eGameType").value.trim() || "Texas Holdem Cash Game with Rebuys",
        roster: document.getElementById("eRoster").value.trim(),
        date: document.getElementById("eDate").value,
        time: document.getElementById("eTime").value,
        overrideKey: gameDateKey(currentGameDateParts(new Date()))
      };
      saveEvent(details);
      view.editOpen = false;
      document.getElementById("editPanel").classList.remove("open");
    });

    document.getElementById("venueForm").addEventListener("submit", function(ev){
      ev.preventDefault();
      var host = document.getElementById("vHost").value.trim();
      var address = document.getElementById("vAddress").value.trim();
      if (!host || !address) return;
      var details = Object.assign({}, state.event, {
        location: address,
        venueHost: host,
        venueKey: state.gameDateKey
      });
      saveEvent(details);
    });

    // data-id on each row is the stable per-person slug, not the database
    // row id — the database id also bakes in the current game_date (see
    // rowIdFor) so each month's response becomes its own row instead of
    // overwriting last month's, which is what makes history possible.
    var rsvpTable = document.getElementById("rsvpTable");
    rsvpTable.addEventListener("click", function(ev){
      var row = ev.target.closest(".rr-row");
      if (!row) return;
      var personSlug = row.getAttribute("data-id");
      var name = row.getAttribute("data-name");
      var existing = state.rsvps.find(function(r){ return slugify(r.name) === personSlug; });
      var dbId = existing ? existing.id : rowIdFor(name);

      if (ev.target.matches(".rr-btn")){
        var clicked = ev.target.getAttribute("data-status");
        if (existing && existing.status === clicked){
          removeRsvp(dbId);
        } else {
          submitRsvp(dbId, {
            name: name,
            status: clicked,
            guests: clicked === "in" ? (existing ? existing.guests : 0) : 0,
            note: existing ? existing.note : "",
            createdAt: existing ? existing.createdAt : Date.now()
          });
        }
        return;
      }
      if (ev.target.matches(".rr-minus") || ev.target.matches(".rr-plus")){
        if (!existing || existing.status !== "in") return;
        var g = Number(existing.guests) || 0;
        g = ev.target.matches(".rr-minus") ? Math.max(0, g - 1) : Math.min(6, g + 1);
        submitRsvp(dbId, { name: existing.name, status: "in", guests: g, note: existing.note, createdAt: existing.createdAt });
      }
    });
    rsvpTable.addEventListener("input", debounce(function(ev){
      if (!ev.target.matches(".rr-note")) return;
      var row = ev.target.closest(".rr-row");
      var personSlug = row.getAttribute("data-id");
      var existing = state.rsvps.find(function(r){ return slugify(r.name) === personSlug; });
      if (!existing) return;
      submitRsvp(existing.id, { name: existing.name, status: existing.status, guests: existing.guests, note: ev.target.value.trim(), createdAt: existing.createdAt });
    }, 600));

    document.getElementById("historyToggle").addEventListener("click", loadHistory);

    refreshHeader();
    refreshVenue();
    refreshRsvpTable();
  }

  function fillEditForm(){
    var e = state.event || {};
    document.getElementById("eGameType").value = e.gameType || "Texas Holdem Cash Game with Rebuys";
    document.getElementById("eRoster").value = e.roster || "";
    var autoKeyNow = gameDateKey(currentGameDateParts(new Date()));
    var overrideActive = e.overrideKey === autoKeyNow && e.date;
    document.getElementById("eDate").value = state.gameDateKey || autoKeyNow;
    document.getElementById("eTime").value = (overrideActive && e.time) ? e.time : "20:00";
  }

  function venueEstablished(e){
    return !!(e && e.venueKey === state.gameDateKey && e.location);
  }

  function refreshHeader(){
    var e = state.event;
    if (!e) return;
    document.getElementById("mWhen").textContent = state.gameDateDisplay || formatGameDateDisplay(currentGameDateParts(new Date()));
    var whereEl = document.getElementById("mWhere");
    var established = venueEstablished(e);
    whereEl.textContent = established ? e.location : "Needs a host";
    whereEl.classList.toggle("venue-needed", !established);
    document.getElementById("mGameType").textContent = e.gameType || "—";

    var seating = computeSeating(state.rsvps, MAX_SEATS);
    document.getElementById("mUsed").textContent = seating.used;
    renderPips(document.getElementById("mPips"), MAX_SEATS, seating.used, seating.waitlist.length);
    var note;
    if (seating.waitlist.length > 0) note = seating.waitlist.length + " on the waitlist";
    else if (seating.used >= MAX_SEATS) note = "Table’s full";
    else note = (MAX_SEATS - seating.used) + " seat" + ((MAX_SEATS - seating.used) === 1 ? "" : "s") + " left";
    document.getElementById("mSeatNote").textContent = note;
  }

  // Venue claims follow the exact same pattern as the date override: a
  // claim only counts if its venueKey matches the current auto-computed
  // cycle. Once the month rolls over, a stale claim is ignored and the
  // card reverts to "needs a host" until someone claims the new month —
  // no deletion required, same trick as the RSVP game_date tagging.
  function refreshVenue(){
    var e = state.event || {};
    var established = venueEstablished(e);
    var statusEl = document.getElementById("venueStatus");
    if (established){
      statusEl.innerHTML = '<p class="venue-banner venue-banner-set">🏠 <strong>' + esc(e.location) + '</strong>'
        + (e.venueHost ? ' — hosted by ' + esc(e.venueHost) : '') + '</p>';
      document.getElementById("venueSubmitBtn").textContent = "Change host or address";
    } else {
      statusEl.innerHTML = '<p class="venue-banner venue-banner-needed">⚠️ No venue yet this month — claim it below.</p>';
      document.getElementById("venueSubmitBtn").textContent = "Click to host this month";
    }
    document.getElementById("vHost").value = established ? (e.venueHost || "") : "";
    document.getElementById("vAddress").value = established ? (e.location || "") : "";

    var datalist = document.getElementById("rosterNames");
    datalist.innerHTML = parseRoster(e.roster).map(function(n){ return '<option value="' + esc(n) + '">'; }).join("");
  }

  function slugify(name){
    var s = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return s || ("p" + Math.random().toString(16).slice(2));
  }
  // The database row id bakes in the current game_date, so each month's
  // response is its own row instead of overwriting last month's — that's
  // what lets attendance history accumulate instead of being erased.
  function rowIdFor(name){
    return slugify(name) + "@" + state.gameDateKey;
  }
  // Accepts names separated by commas, newlines, or both — whichever way
  // someone pastes the list in, it splits into individual players instead
  // of treating the whole block as one name.
  function parseRoster(rosterStr){
    return (rosterStr || "").split(/[,\n]/).map(function(s){ return s.trim(); }).filter(Boolean);
  }
  function debounce(fn, wait){
    var t;
    return function(){
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(ctx, args); }, wait);
    };
  }

  function rsvpRowHtml(r, seatNum, waiting){
    var status = r.status || "";
    function btn(kind, label){
      return '<button type="button" class="rr-btn' + (status === kind ? " active" : "") + '" data-status="' + kind + '">' + label + "</button>";
    }
    // Seat numbers are gone — only the waitlisted flag still shows, since
    // that's a status worth knowing, not just a count.
    var seatText = status === "in" && waiting ? "waitlisted" : "";
    var seatClass = "rr-seat" + (status === "in" && waiting ? " waiting" : "");
    // The guest stepper stays in the DOM and keeps its column width even
    // when hidden (visibility, not display/hidden), so the note field
    // always starts at the same x-position regardless of a row's status.
    var guestsStyle = status === "in" ? "" : ' style="visibility:hidden"';
    return ""
      + '<div class="rr-row" data-id="' + esc(slugify(r.name)) + '" data-name="' + esc(r.name) + '">'
      +   '<span class="rr-name">' + esc(r.name) + "</span>"
      +   '<span class="' + seatClass + '">' + seatText + "</span>"
      +   '<div class="rr-status">' + btn("in", "In") + btn("maybe", "Maybe") + btn("out", "Can’t") + "</div>"
      +     '<div class="rr-guests"' + guestsStyle + '>'
      +       '<button type="button" class="rr-minus">−</button><span class="rr-count">' + (1 + (Number(r.guests) || 0)) + '</span><button type="button" class="rr-plus">+</button>'
      +     "</div>"
      +     '<input type="text" class="rr-note" placeholder="note" value="' + esc(r.note || "") + '"' + (status ? "" : " disabled") + ">"
      +   "</div>"
      + "</div>";
  }

  // One clickable row per player, sorted In first, then Maybe, then Can't,
  // then anyone who hasn't answered yet. Within "In", confirmed seats
  // (numbered, in signup order) come before anyone waitlisted. Nothing is
  // hidden or split into separate sections — the order alone tells the
  // story. Preserves focus/caret on the note currently being typed into,
  // since this rebuilds the whole list on every change, including from
  // other people's concurrent edits.
  function refreshRsvpTable(){
    var e = state.event;
    if (!e) return;
    var container = document.getElementById("rsvpTable");
    var emptyRoster = document.getElementById("emptyRoster");
    var names = parseRoster(e.roster);

    var focused = document.activeElement && document.activeElement.matches(".rr-note") ? document.activeElement : null;
    var focusedId = focused ? focused.closest(".rr-row").getAttribute("data-id") : null;
    var caretPos = focused ? focused.selectionStart : null;

    // Keyed by the stable person slug, not r.id — r.id now bakes in the
    // game_date (see rowIdFor) so it differs from slugify(r.name).
    var byId = {};
    state.rsvps.forEach(function(r){ byId[slugify(r.name)] = r; });
    var seating = computeSeating(state.rsvps, MAX_SEATS);
    var confirmedIdx = {}; seating.confirmed.forEach(function(r, i){ confirmedIdx[slugify(r.name)] = i + 1; });
    var waitlistIds = {}; seating.waitlist.forEach(function(r){ waitlistIds[slugify(r.name)] = true; });

    var rosterSlugs = {};
    var entries = names.map(function(name){
      var id = slugify(name);
      rosterSlugs[id] = true;
      return byId[id] || { id: id, name: name, status: null, guests: 0, note: "" };
    });
    state.rsvps.forEach(function(r){
      if (!rosterSlugs[slugify(r.name)]) entries.push(r);
    });

    var statusRank = { in: 0, maybe: 1, out: 2 };
    entries.sort(function(a, b){
      var ra = a.status ? statusRank[a.status] : 3;
      var rb = b.status ? statusRank[b.status] : 3;
      if (ra !== rb) return ra - rb;
      if (a.status === "in"){
        var aSlug = slugify(a.name), bSlug = slugify(b.name);
        var aw = waitlistIds[aSlug] ? 1 : 0, bw = waitlistIds[bSlug] ? 1 : 0;
        if (aw !== bw) return aw - bw;
        return (confirmedIdx[aSlug] || 999) - (confirmedIdx[bSlug] || 999);
      }
      return 0; // stable sort keeps roster order among ties
    });

    var rows = entries.map(function(r){ var s = slugify(r.name); return rsvpRowHtml(r, confirmedIdx[s], waitlistIds[s]); });

    if (rows.length === 0){
      container.innerHTML = "";
      container.style.display = "none";
      emptyRoster.hidden = false;
      return;
    }
    container.style.display = "";
    emptyRoster.hidden = true;
    container.innerHTML = rows.join("");

    // Size every name column to whichever name is actually longest, so
    // short names don't get extra padding and long ones don't truncate —
    // measured after render since it depends on the rendered font.
    var nameEls = container.querySelectorAll(".rr-name");
    var maxNameWidth = 0;
    nameEls.forEach(function(el){ maxNameWidth = Math.max(maxNameWidth, el.scrollWidth); });
    nameEls.forEach(function(el){ el.style.width = maxNameWidth + "px"; });

    if (focusedId){
      var el = container.querySelector('.rr-row[data-id="' + CSS.escape(focusedId) + '"] .rr-note');
      if (el){ el.focus(); if (caretPos != null) el.setSelectionRange(caretPos, caretPos); }
    }
  }

  /* ---------------- Render dispatch ---------------- */

  function render(){
    var mode = state.event ? "main" : "setup";
    if (mode !== view.mode){
      view.mode = mode;
      view.mainMounted = false;
      if (mode === "setup") mountSetup();
      else mountMain();
      return;
    }
    if (mode === "main" && view.mainMounted){
      refreshHeader();
      refreshRsvpTable();
    }
  }

  /* ---------------- Data layer ---------------- */

  function dbRowToEvent(row){
    return {
      location: row.location, gameType: row.game_type, roster: row.roster || "",
      date: row.date, time: row.time, overrideKey: row.override_key || null,
      venueHost: row.venue_host || null, venueKey: row.venue_key || null
    };
  }
  function eventToDbRow(e){
    return {
      id: "main", location: e.location, game_type: e.gameType, roster: e.roster,
      date: e.date, time: e.time, override_key: e.overrideKey,
      venue_host: e.venueHost, venue_key: e.venueKey
    };
  }
  function dbRowToRsvp(row){
    return {
      id: row.id, name: row.name, status: row.status,
      guests: Number(row.guests) || 0, note: row.note || "", createdAt: Number(row.created_at) || 0
    };
  }

  function saveEvent(details){
    state.event = details;
    render();
    if (!state.db) return;
    state.db.from("event_details").upsert(eventToDbRow(details)).then(function(res){
      if (res.error) showBanner("Couldn’t save game details: " + res.error.message);
    });
  }
  function submitRsvp(id, data){
    var i = state.rsvps.findIndex(function(r){ return r.id === id; });
    var row = Object.assign({id: id}, data);
    if (i >= 0) state.rsvps[i] = row; else state.rsvps.push(row);
    render();
    if (!state.db) return;
    state.db.from("rsvps").upsert({
      id: id, name: data.name, status: data.status, guests: data.guests,
      note: data.note, created_at: data.createdAt, game_date: state.gameDateKey
    }).then(function(res){
      if (res.error) showBanner("Couldn’t save your RSVP: " + res.error.message);
    });
  }
  function removeRsvp(id){
    state.rsvps = state.rsvps.filter(function(r){ return r.id !== id; });
    render();
    if (!state.db) return;
    state.db.from("rsvps").delete().eq("id", id).then(function(res){
      if (res.error) showBanner("Couldn’t remove your RSVP: " + res.error.message);
    });
  }

  // Tallies every RSVP ever recorded (across all months) per person, since
  // each month now gets its own row (see rowIdFor) instead of overwriting
  // the last one.
  function computeHistory(rows){
    var byName = {};
    rows.forEach(function(r){
      if (!byName[r.name]) byName[r.name] = { name: r.name, in: 0, maybe: 0, out: 0, months: {} };
      var e = byName[r.name];
      if (r.status === "in") e.in++;
      else if (r.status === "maybe") e.maybe++;
      else if (r.status === "out") e.out++;
      if (r.game_date) e.months[r.game_date] = true;
    });
    return Object.keys(byName).map(function(k){
      var e = byName[k];
      return { name: e.name, in: e.in, maybe: e.maybe, out: e.out, tracked: Object.keys(e.months).length };
    }).sort(function(a, b){ return b.in - a.in || a.name.localeCompare(b.name); });
  }

  function renderHistory(list){
    if (list.length === 0) return '<p class="hint">No history yet — it fills in once a month or two has passed.</p>';
    return '<div class="hist-list">' + list.map(function(e){
      return '<div class="hist-row">'
        + '<span class="hist-name">' + esc(e.name) + '</span>'
        + '<span class="hist-stat">In ' + e.in + '</span>'
        + '<span class="hist-stat">Maybe ' + e.maybe + '</span>'
        + '<span class="hist-stat">Can’t ' + e.out + '</span>'
        + '<span class="hist-stat mono">' + e.tracked + ' month' + (e.tracked === 1 ? '' : 's') + ' tracked</span>'
        + '</div>';
    }).join('') + '</div>';
  }

  async function loadHistory(){
    var panel = document.getElementById("historyPanel");
    if (!panel.hidden){ panel.hidden = true; return; }
    panel.hidden = false;
    panel.innerHTML = '<p class="hint">Loading…</p>';
    if (!state.db){ panel.innerHTML = '<p class="hint">Not connected to the database.</p>'; return; }
    var res = await state.db.from("rsvps").select("name,status,game_date");
    if (res.error){ panel.innerHTML = '<p class="hint">Couldn’t load history: ' + esc(res.error.message) + '</p>'; return; }
    panel.innerHTML = renderHistory(computeHistory(res.data || []));
  }

  function showBanner(text){
    var b = document.getElementById("banner");
    b.textContent = text;
    b.hidden = false;
  }
  function hideBanner(){
    document.getElementById("banner").hidden = true;
  }

  async function refetchAll(){
    var client = state.db;
    var evRes = await client.from("event_details").select("*").eq("id", "main").maybeSingle();
    if (evRes.error){ showBanner("Can’t reach the database: " + evRes.error.message + ". Make sure setup.sql has been run in Supabase."); return; }
    state.event = evRes.data ? dbRowToEvent(evRes.data) : null;

    var eff = effectiveGameInfo(state.event, new Date());
    state.gameDateKey = eff.key;
    state.gameDateDisplay = eff.display;

    var rsRes = await client.from("rsvps").select("*").eq("game_date", state.gameDateKey).order("created_at", {ascending: true});
    if (rsRes.error){ showBanner("Can’t reach the database: " + rsRes.error.message); return; }
    state.rsvps = (rsRes.data || []).map(dbRowToRsvp);
    hideBanner();
  }

  async function boot(){
    if (typeof window.supabase === "undefined" || !window.supabase.createClient){
      showBanner("Couldn’t load the database library. Check your connection and reload the page.");
      render();
      return;
    }
    var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    state.db = client;

    await refetchAll();
    render();

    client
      .channel("deal-me-in-live")
      .on("postgres_changes", {event: "*", schema: "public", table: "event_details"}, function(){ refetchAll().then(render); })
      .on("postgres_changes", {event: "*", schema: "public", table: "rsvps"}, function(){ refetchAll().then(render); })
      .subscribe();
  }

  render(); // immediate first paint (setup screen) before db resolves
  boot();
})();
</script>
